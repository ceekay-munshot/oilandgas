name: Refresh company data

# Step 2 of the client pipeline. Logs into Screener, scrapes the financial
# statements and downloads the last four concall transcripts + latest investor
# PPT for each company, then commits data/financials.json, data/docs-manifest.json
# and the resolved slugs in data/companies.json.
#
# The extracted document text is cached under pipeline/cache/ (gitignored) - too
# large to commit, and prompt 7's AI extractor reads it from the same run.
#
# Run the smoke scope (4 companies) first from the Actions tab to confirm login
# and parsing before scaling to all 27.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'How many companies (dump = recon one company, writes nothing)'
        type: choice
        options: [smoke, all, dump]
        default: smoke
      incremental:
        description: 'Skip companies with no filing newer than we already hold (faster; watch the first run)'
        type: boolean
        default: false
      refreshCommentary:
        description: 'Re-read every concall (only after a commentary prompt change - costs one model call per company)'
        type: boolean
        default: false
  schedule:
    # The brief's auto-trigger cadence: stages 2-6 run DAILY during earnings
    # months and WEEKLY the rest of the year. Indian results land in Jan-Feb,
    # Apr-May, Jul-Aug and Oct-Nov, so outside those four windows a daily run
    # would re-check documents that cannot have changed.
    # (Stage 1, the macro pull, runs daily all year in refresh-macro.yml.)
    #
    # A run on unchanged data is a no-op: it finds no new filing, asks the model
    # nothing and commits nothing, so the cost of the daily window is Actions
    # minutes rather than model spend.
    - cron: '30 5 * 1,2,4,5,7,8,10,11 *'   # daily, earnings months
    - cron: '30 5 * 3,6,9,12 1'            # Mondays only, the quiet months

permissions:
  contents: write

concurrency:
  group: refresh-company
  cancel-in-progress: false

jobs:
  company:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Job-level so every step sees them.
    env:
      # Paid pair wins when set (only a subscribed account reads AI summaries);
      # the free pair stays as the fallback.
      SCREENER_PAID_EMAIL:    ${{ secrets.SCREENER_PAID_EMAIL }}
      SCREENER_PAID_PASSWORD: ${{ secrets.SCREENER_PAID_PASSWORD }}
      SCREENER_EMAIL:    ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SCRAPEDO_API_KEY:  ${{ secrets.SCRAPEDO_API_KEY }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
      # Optional: override the extraction model without a code change.
      OPENAI_MODEL:      ${{ vars.OPENAI_MODEL }}
      MISTRAL_MODEL:     ${{ vars.MISTRAL_MODEL }}
      # Additive Claude/Bedrock path (pipeline/lib/llm-bedrock.mjs) - inert
      # unless LLM_PROVIDER is set to "claude" as a repo variable; unset/any
      # other value keeps every run on the OpenAI path exactly as before.
      LLM_PROVIDER:            ${{ vars.LLM_PROVIDER || 'claude' }}
      CLAUDE_BEDROCK_API_KEY:  ${{ secrets.temp_claude_token }}
      BEDROCK_REGION:          ${{ vars.BEDROCK_REGION }}
      BEDROCK_MODEL_ID:        ${{ vars.BEDROCK_MODEL_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: pipeline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # chromium is installed explicitly below
        run: npm install --no-audit --no-fund

      - name: Verify parsers
        working-directory: pipeline
        run: npm test

      - name: Install Chromium
        working-directory: pipeline
        run: npx playwright install --with-deps chromium

      # A manual run honours the chosen scope; the weekly schedule does all 27.
      - name: Scrape Screener
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/scrape-screener.mjs --scope ${{ github.event.inputs.scope || 'all' }}${{ github.event.inputs.incremental == 'true' && ' --incremental' || '' }}

      # Recon only - dump one company's concall markup, no scrape, no extract.
      - name: Dump concall markup
        if: ${{ github.event.inputs.scope == 'dump' }}
        run: node pipeline/scrape-screener.mjs --scope dump

      # Step 3a: the government's own refinery throughput, BEFORE the model is
      # asked anything. PPAC publishes crude processing per company monthly, so
      # for IOCL/BPCL/HPCL/Reliance those cells are filled deterministically and
      # tagged [Official] - and because they are already in the store when the
      # extractor plans its questions, the model is never asked (or paid) for a
      # number the ministry already published.
      #
      # Never fails the run: no OCR credit, a listing page down or a layout
      # change all leave the store untouched and say so in the log.
      - name: Fetch PPAC throughput
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/fetch-ppac-kpis.mjs

      # Step 3b: read the documents just cached above and extract the KPIs. Same
      # job on purpose - the cache is gitignored and lives only for this run.
      - name: Extract KPIs
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/extract-kpis.mjs --scope ${{ github.event.inputs.scope || 'all' }}

      # Step 4: classify how management SOUNDED each quarter from the same cached
      # concalls -> data/commentary.json (the Commentary tab). Same job so it reads
      # this run's cache; accumulates in data/commentary-store.json like the KPIs.
      #
      # A quarter that already carries a tone is never re-asked, whatever the
      # prompt version - "the first real reading stands". The fingerprint only
      # re-opens quarters that came back empty. So after a change that asks the
      # model for MORE about each quarter (a new template field), the stored
      # quarters keep their old shape until someone re-asks on purpose. That is
      # what refreshCommentary is for: one model call per company, deliberately
      # opt-in, because it spends the key on work already paid for once.
      - name: Extract commentary
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/extract-commentary.mjs --scope ${{ github.event.inputs.scope || 'all' }}${{ github.event.inputs.refreshCommentary == 'true' && ' --refresh' || '' }}

      # Step 5: the KPIs and tones above are what the cycle reading is computed
      # from, so rescore in the same job -> data/scores.json. No network, no model
      # call, and it re-reads data/ from disk, so it always matches what just landed.
      - name: Rescore the cycle
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/rescore.mjs

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # companies.json carries the resolved slugs; the rest is the gathered
          # material and the extracted KPIs. The document cache is gitignored.
          #
          # kpi-store.json (and commentary-store.json) MUST be committed: they are
          # the durable record of every value/tone ever extracted, and what lets the
          # next run skip work already paid for. Drop them and every run starts over.
          FILES="data/financials.json data/docs-manifest.json data/companies.json data/kpis.json data/insights.json data/kpi-store.json data/commentary.json data/commentary-store.json data/scores.json data/scores-history.json"
          if git diff --quiet -- $FILES; then
            echo "No company-data change - nothing to commit."
            exit 0
          fi

          git add $FILES
          # No [skip ci]: the deploy has to run so the dashboard sees new data.
          git commit -m "chore(data): refresh company financials, docs & KPIs"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt/5)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $(( attempt * 3 ))
          done

          echo "Could not push after 5 attempts."
          exit 1
