name: Probe macro scrapers

# Manual only. Two things it can do:
#
#   both / apm / baltic-dirty  - point the scraper at the two sources that only
#     answer a rendered request, and print everything they return: which scraper
#     answered, how big the document was, the text around every keyword worth
#     anchoring on, and what the parsers make of it.
#
#   full-dry-run - run all six tiles exactly as the daily refresh does, with the
#     scraper keys in place, and print the coverage table without writing
#     anything. This is how to check that all six are genuinely live.
#
# The probe exists because APM and BDTI were originally written from
# documentation. The log is the deliverable: selectors get written from what it
# prints, not from what a doc page claims.
#
# Commits nothing and touches no data file. Safe to run repeatedly, though each
# run spends a few Firecrawl credits.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which to probe'
        type: choice
        options: [both, apm, baltic-dirty, full-dry-run]
        default: both

permissions:
  contents: read              # read-only: a probe must never write data

concurrency:
  group: probe-macro
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-level so every step sees them.
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SCRAPEDO_API_KEY:  ${{ secrets.SCRAPEDO_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which keys are visible
        run: |
          echo "FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:+set}${FIRECRAWL_API_KEY:-MISSING}"
          echo "SCRAPEDO_API_KEY:  ${SCRAPEDO_API_KEY:+set}${SCRAPEDO_API_KEY:-MISSING}"
          echo "(values are never printed - only whether GitHub handed them to the job)"

      - name: Probe APM
        if: ${{ inputs.target == 'both' || inputs.target == 'apm' }}
        run: node pipeline/fetch-macro.mjs --probe apm

      - name: Probe Baltic Dirty Tanker
        if: ${{ inputs.target == 'both' || inputs.target == 'baltic-dirty' }}
        run: node pipeline/fetch-macro.mjs --probe baltic-dirty

      # All six tiles, keys and all, writing nothing. The coverage line at the
      # end is the answer to "are they actually live?".
      - name: Full dry run (all six tiles, nothing written)
        if: ${{ inputs.target == 'full-dry-run' }}
        run: node pipeline/fetch-macro.mjs --dry-run

      - name: What to do with this log
        if: always()
        run: |
          echo "Copy this whole log back into the conversation."
          echo "A probe that proves a source is unreachable is a useful result:"
          echo "the tile stays 'awaiting' with that reason instead of guessing."
