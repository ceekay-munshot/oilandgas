name: Probe macro scrapers

# Manual only. Two things it can do:
#
#   both / apm / baltic-dirty  - point the scraper at the two sources that only
#     answer a rendered request, and print everything they return: which scraper
#     answered, how big the document was, the text around every keyword worth
#     anchoring on, and what the parsers make of it.
#
#   full-dry-run - run all six tiles exactly as the daily refresh does, with the
#     scraper keys in place, and print the coverage table without writing
#     anything. This is how to check that all six are genuinely live.
#
# The probe exists because APM and BDTI were originally written from
# documentation. The log is the deliverable: selectors get written from what it
# prints, not from what a doc page claims.
#
# Commits nothing and touches no data file. Safe to run repeatedly, though each
# run spends a few Firecrawl credits.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which to probe'
        type: choice
        options: [both, apm, baltic-dirty, ppac-flash, ppac-kpis, pngrb-cgd, kpi-sources, full-dry-run]
        default: both

permissions:
  contents: read              # read-only: a probe must never write data

concurrency:
  group: probe-macro
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-level so every step sees them.
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SCRAPEDO_API_KEY:  ${{ secrets.SCRAPEDO_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which keys are visible
        run: |
          echo "FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:+set}${FIRECRAWL_API_KEY:-MISSING}"
          echo "SCRAPEDO_API_KEY:  ${SCRAPEDO_API_KEY:+set}${SCRAPEDO_API_KEY:-MISSING}"
          echo "(values are never printed - only whether GitHub handed them to the job)"

      - name: Probe APM
        if: ${{ inputs.target == 'both' || inputs.target == 'apm' }}
        run: node pipeline/fetch-macro.mjs --probe apm

      - name: Probe Baltic Dirty Tanker
        if: ${{ inputs.target == 'both' || inputs.target == 'baltic-dirty' }}
        run: node pipeline/fetch-macro.mjs --probe baltic-dirty

      # Reconnaissance for the KPI-coverage gap. Neither of these has a parser
      # yet, on purpose: the first run is to SEE what the scraper gets back
      # before a selector is written against it.
      #
      # ppac-flash  the only free publication carrying refinery-wise throughput
      #             for IOCL/BPCL/HPCL. The PDF is scanned - 559 characters of
      #             text layer from 539 KB - so this tests Firecrawl's OCR.
      # pngrb-cgd   entity-level CNG+PNG volumes for IGL, Mahanagar and Gujarat
      #             Gas. The data-bank page names the datasets but loads the
      #             file rows by script, so this tests whether the scraper
      #             renders them.
      - name: Probe PPAC flash report (refinery-wise throughput)
        if: ${{ inputs.target == 'ppac-flash' || inputs.target == 'kpi-sources' }}
        run: node pipeline/fetch-macro.mjs --probe ppac-flash

      # The fetcher itself, end to end, writing nothing. Discovery, OCR, parse,
      # quarter arithmetic and the merge all run for real against the committed
      # store - only the final write is skipped. The last two lines of the log
      # are the answer: how many cells it would gain, correct and hold.
      #
      # Run this BEFORE trusting a refresh to do it unwatched, and after any
      # change to the Snapshot parser: the OCR path has no local equivalent, so
      # this is the only place it can be checked.
      - name: Dry-run the PPAC throughput fetcher (writes nothing)
        if: ${{ inputs.target == 'ppac-kpis' || inputs.target == 'kpi-sources' }}
        run: node pipeline/fetch-ppac-kpis.mjs --dry-run

      - name: Probe PNGRB data bank (CGD volumes by company)
        if: ${{ inputs.target == 'pngrb-cgd' || inputs.target == 'kpi-sources' }}
        run: node pipeline/fetch-macro.mjs --probe pngrb-cgd

      # All the tiles, keys and all, writing nothing. The coverage line at the
      # end is the answer to "are they actually live?".
      - name: Full dry run (all six tiles, nothing written)
        if: ${{ inputs.target == 'full-dry-run' }}
        run: node pipeline/fetch-macro.mjs --dry-run

      - name: What to do with this log
        if: always()
        run: |
          echo "Copy this whole log back into the conversation."
          echo "A probe that proves a source is unreachable is a useful result:"
          echo "the tile stays 'awaiting' with that reason instead of guessing."
          echo ""
          echo "For ppac-flash and pngrb-cgd the useful part is the KEYWORD CONTEXT"
          echo "block: it shows whether company names and volume figures survived"
          echo "the OCR / the render. That is what a parser would be anchored on."
