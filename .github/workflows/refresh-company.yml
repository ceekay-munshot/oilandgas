name: Refresh company data

# Step 2 of the client pipeline. Logs into Screener, scrapes the financial
# statements and downloads the last four concall transcripts + latest investor
# PPT for each company, then commits data/financials.json, data/docs-manifest.json
# and the resolved slugs in data/companies.json.
#
# The extracted document text is cached under pipeline/cache/ (gitignored) - too
# large to commit, and prompt 7's AI extractor reads it from the same run.
#
# Run the smoke scope (4 companies) first from the Actions tab to confirm login
# and parsing before scaling to all 27.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'How many companies (dump = recon one company, writes nothing)'
        type: choice
        options: [smoke, all, dump]
        default: smoke
  schedule:
    - cron: '30 5 * * 1'      # 05:30 UTC Mondays, before refresh-full at 06:40
    # TEMPORARY - Q1 FY27 earnings week. Also run Tue/Wed/Thu so a concall filed
    # mid-week is on the dashboard within a day instead of waiting for next
    # Monday. A run on unchanged data is a ~14-min no-op (it commits nothing), so
    # the only cost is Actions minutes. REMOVE these lines after 2026-07-30.
    - cron: '30 5 * * 2,3,4'  # 05:30 UTC Tue-Thu

permissions:
  contents: write

concurrency:
  group: refresh-company
  cancel-in-progress: false

jobs:
  company:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Job-level so every step sees them.
    env:
      # Paid pair wins when set (only a subscribed account reads AI summaries);
      # the free pair stays as the fallback.
      SCREENER_PAID_EMAIL:    ${{ secrets.SCREENER_PAID_EMAIL }}
      SCREENER_PAID_PASSWORD: ${{ secrets.SCREENER_PAID_PASSWORD }}
      SCREENER_EMAIL:    ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SCRAPEDO_API_KEY:  ${{ secrets.SCRAPEDO_API_KEY }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
      # Optional: override the extraction model without a code change.
      OPENAI_MODEL:      ${{ vars.OPENAI_MODEL }}
      MISTRAL_MODEL:     ${{ vars.MISTRAL_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: pipeline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # chromium is installed explicitly below
        run: npm install --no-audit --no-fund

      - name: Verify parsers
        working-directory: pipeline
        run: npm test

      - name: Install Chromium
        working-directory: pipeline
        run: npx playwright install --with-deps chromium

      # A manual run honours the chosen scope; the weekly schedule does all 27.
      - name: Scrape Screener
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/scrape-screener.mjs --scope ${{ github.event.inputs.scope || 'all' }}

      # Recon only - dump one company's concall markup, no scrape, no extract.
      - name: Dump concall markup
        if: ${{ github.event.inputs.scope == 'dump' }}
        run: node pipeline/scrape-screener.mjs --scope dump

      # Step 3: read the documents just cached above and extract the KPIs. Same
      # job on purpose - the cache is gitignored and lives only for this run.
      - name: Extract KPIs
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/extract-kpis.mjs --scope ${{ github.event.inputs.scope || 'all' }}

      # Step 4: classify how management SOUNDED each quarter from the same cached
      # concalls -> data/commentary.json (the Commentary tab). Same job so it reads
      # this run's cache; accumulates in data/commentary-store.json like the KPIs.
      - name: Extract commentary
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/extract-commentary.mjs --scope ${{ github.event.inputs.scope || 'all' }}

      # Step 5: the KPIs and tones above are what the cycle reading is computed
      # from, so rescore in the same job -> data/scores.json. No network, no model
      # call, and it re-reads data/ from disk, so it always matches what just landed.
      - name: Rescore the cycle
        if: ${{ github.event.inputs.scope != 'dump' }}
        run: node pipeline/rescore.mjs

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # companies.json carries the resolved slugs; the rest is the gathered
          # material and the extracted KPIs. The document cache is gitignored.
          #
          # kpi-store.json (and commentary-store.json) MUST be committed: they are
          # the durable record of every value/tone ever extracted, and what lets the
          # next run skip work already paid for. Drop them and every run starts over.
          FILES="data/financials.json data/docs-manifest.json data/companies.json data/kpis.json data/insights.json data/kpi-store.json data/commentary.json data/commentary-store.json data/scores.json"
          if git diff --quiet -- $FILES; then
            echo "No company-data change - nothing to commit."
            exit 0
          fi

          git add $FILES
          # No [skip ci]: the deploy has to run so the dashboard sees new data.
          git commit -m "chore(data): refresh company financials, docs & KPIs"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt/5)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $(( attempt * 3 ))
          done

          echo "Could not push after 5 attempts."
          exit 1
